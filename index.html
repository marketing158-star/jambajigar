<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Channel</title>
    
    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    fbq('init', '2663979187367103');
    fbq('track', 'PageView');
    </script>
    <noscript>
        <img height="1" width="1" style="display:none" 
             src="https://www.facebook.com/tr?id=2663979187367103&ev=PageView&noscript=1"/>
    </noscript>
    <!-- End Meta Pixel Code -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(245, 158, 11, 0.2), transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(34, 197, 94, 0.15), transparent 50%);
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: rgba(18, 18, 20, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.35);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.95);
            position: relative;
            overflow: hidden;
        }

        /* 20% बड़ा अवतार इमेज */
        .avatar-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 14px;
        }

        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -3.5px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #22c55e, #eab308);
            animation: pulse-glow 3s infinite alternate;
            z-index: 0;
        }

        .profile-img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid #121214;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        /* 20% बड़ी हेडिंग */
        h1 {
            color: #fbbf24;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
        }

        .sub-text {
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.5;
            margin-bottom: 14px;
            background: rgba(255, 255, 255, 0.04);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px dashed rgba(245, 158, 11, 0.25);
        }

        .badge-pill {
            display: inline-block;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .users-count {
            color: #a1a1aa;
            font-size: 12.5px;
            font-weight: 500;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .info-box {
            background: rgba(32, 32, 36, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f4f4f5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: default;
            pointer-events: none;
            user-select: none;
        }

        .cta-btn {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #ffffff;
            font-weight: 800;
            font-size: 15.5px;
            letter-spacing: 0.5px;
            padding: 14px;
            width: 100%;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 7px 22px rgba(34, 197, 94, 0.35);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .cta-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent,
                rgba(255, 255, 255, 0.25),
                transparent
            );
            transform: rotate(30deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .cta-btn:active {
            transform: scale(0.97);
        }

        .timer-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 12.5px;
            font-weight: 600;
            margin-top: 12px;
        }

        .footer-text {
            margin-top: 14px;
            font-size: 11.5px;
            color: #71717a;
        }

        .footer-text span {
            color: #4ade80;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- प्रोफाइल फोटो -->
        <div class="avatar-wrapper">
            <img src="profile.png" alt="Profile" class="profile-img">
        </div>

        <!-- हेडिंग -->
        <h1>👑 𝐑𝐀𝐉𝐀𝐍 𝐁𝐇𝐀𝐈 𝐒𝐀𝐓𝐓𝐀 𝐊𝐈𝐍𝐆</h1>

        <!-- डिस्क्रिप्शन -->
        <p class="sub-text">
            डेली सिंगल जोड़ी फ्री मिलेगी। ख़बर सबसे पहले पाने के लिए टेलीग्राम चैनल ज्वाइन करें 👑
        </p>

        <div class="badge-pill">⚡ ALL MATKA GAMES AVAILABLE ⚡</div>
        <div class="users-count">👥 40k+ users joined</div>

        <!-- इन्फो बॉक्स लिस्ट -->
        <div class="info-list">
            <div class="info-box">🤝 💎 फरीदाबाद, गाजियाबाद 💎</div>
            <div class="info-box">🤝 💎 गली , दिसावर 💎</div>
            <div class="info-box">📚 1001% FIX GAME MILEGA</div>
        </div>

        <!-- मुख्य टेलीग्राम बटन -->
        <button id="telegramLink" class="cta-btn" onclick="trackButtonClick()">
            🚀 JOIN TELEGRAM CHANNEL
        </button>

        <!-- टाइमर -->
        <div class="timer-badge" id="timer">
            ⏱ Redirecting in 30...
        </div>

        <!-- फुटर -->
        <div class="footer-text">Managed by <span>elite marketing</span></div>
    </div>

    <script>
        var isClicked = false;
        var telegramUrl = "https://t.me/+Oh7tBMSmfYwwYjll"; 
        var pageLoadTime = Date.now();

        if (sessionStorage.getItem('hasClickedTelegram')) {
            isClicked = true;
        }

        function trackButtonClick() {
            var currentTime = Date.now();
            var timeSpent = (currentTime - pageLoadTime) / 1000;

            if (timeSpent < 0.8) {
                window.location.href = telegramUrl;
                return;
            }

            if (!isClicked) {
                isClicked = true;
                sessionStorage.setItem('hasClickedTelegram', 'true');

                if (typeof fbq !== 'undefined') {
                    fbq('trackCustom', 'TelegramBtnClick'); 
                    fbq('track', 'Subscribe'); 
                }

                var btn = document.getElementById('telegramLink');
                if (btn) {
                    btn.style.pointerEvents = 'none';
                    btn.style.opacity = '0.7';
                }

                setTimeout(function() {
                    window.location.href = telegramUrl;
                }, 300);
            } else {
                window.location.href = telegramUrl;
            }
        }

        var timeLeft = 30;
        var timerElement = document.getElementById('timer');
        var countdown = setInterval(function() {
            timeLeft--;
            if (timeLeft > 0) {
                timerElement.innerText = "⏱ Redirecting in " + timeLeft + "...";
            } else {
                clearInterval(countdown);
                timerElement.innerText = "⚡ Redirecting now...";
                trackButtonClick();
            }
        }, 1000);
    </script>

</body>
</html>
